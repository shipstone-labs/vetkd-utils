
[workspace]
resolver = "2"
members = [
    "packages/vetkd-notes-canister",
    "packages/vetkd-notes",
    "packages/vetkd-notes-client",
    "vetkd-devkit/cdk/encrypted_maps",
    "vetkd-devkit/cdk/encrypted_maps_example",
    "vetkd-devkit/cdk/key_manager",
    "vetkd-devkit/cdk/key_manager_example",
    "vetkd-devkit/cdk/test_utils",
    "vetkd-devkit/cdk/types",
    "vetkd-devkit/cdk/utils",
]

[workspace.package]
  edition = "2021"
  version = "0.1.0"
  authors = ["richtera"]
  description = "vetkd utils"
  documentation = "Utilities to use vetkd to store encrypted notes"
  repository = "https://github.com/shipstone-labs/vetkd-utils"
  license = "MIT"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"

[workspace.dependencies]
hex = { version = "0.4.3", features = ["serde"] }
ic_bls12_381 = { version = "0.10.1", default-features = false, features = [
    "groups",
    "pairings",
    "alloc",
    "experimental",
    "zeroize",
] }
lazy_static = "1.5.0"
pairing = "0.23"
sha2 = "0.10.9"
sha3 = "0.10.8"
subtle = "2.6.1"
rand = { version = "0.8.5", features = ["small_rng"] }
rand_chacha = "0.3.1"
zeroize = { version = "1.8.1", features = ["zeroize_derive"] }
serde = "1.0.219"
anyhow = "1.0.95"
candid = "0.10.2"
ic-cdk = "0.13.0"
ic-cdk-macros = "0.13.0"
ic-stable-structures = "0.6.5"
ic-types = "0.7.0"
ic-vetkd-utils = { version = "0.1.0", git = "https://github.com/dfinity/ic.git" }
pocket-ic = "7.0.0"
serde_cbor = "0.11.2"
serde_json = "1.0.138"
